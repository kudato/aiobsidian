name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - run: uv python install ${{ matrix.python }}

      # --locked: a lock file that fell behind pyproject.toml fails
      # here, rather than being quietly re-resolved on the runner.
      - run: uv sync --locked --group dev

      - name: Audit dependencies
        run: uv audit --frozen --no-dev --no-group docs --preview-features audit

      - name: Lint
        run: uv run ruff check src/ tests/ tools/

      - name: Format check
        run: uv run ruff format --check src/ tests/ tools/

      - name: Type check
        run: uv run mypy src/ tools/ tests/typing_examples.py

      - name: Tests
        run: uv run pytest --cov=aiobsidian --cov-report=term-missing --cov-report=xml

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python }}
          path: coverage.xml

  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      # No lock file yet, so this resolves on every run. It is four
      # build-time dependencies and nothing ships to a user from here,
      # but a lock file and `npm ci` belong in this step once one can
      # be generated.
      - run: npm install --no-audit --no-fund

      # Obsidian reads the manifest at the repository root, and the
      # plugin is built from the one beside its source. They are the
      # same file or the catalog ships a version nobody built.
      - name: The two manifests agree
        run: diff ../manifest.json manifest.json

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  # The status check the main-protection ruleset requires is named `ci`,
  # and a matrix job reports one context per interpreter, none of them
  # spelled that. This is the one that is: it stands for everything
  # above it, so adding an interpreter or a job never means editing the
  # ruleset.
  ci:
    needs: [tests, plugin]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every interpreter passed
        run: test "${{ needs.tests.result }}" = "success"

      - name: The plugin passed
        run: test "${{ needs.plugin.result }}" = "success"
