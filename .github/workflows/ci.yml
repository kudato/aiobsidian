name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - run: uv python install ${{ matrix.python }}

      # --locked: a lock file that fell behind pyproject.toml fails
      # here, rather than being quietly re-resolved on the runner.
      - run: uv sync --locked --group dev

      - name: Audit dependencies
        run: uv audit --frozen --no-dev --no-group docs --preview-features audit

      - name: Lint
        run: uv run ruff check src/ tests/ tools/

      - name: Format check
        run: uv run ruff format --check src/ tests/ tools/

      - name: Type check
        run: uv run mypy src/ tools/ tests/typing_examples.py

      - name: Tests
        run: uv run pytest --cov=aiobsidian --cov-report=term-missing --cov-report=xml

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python }}
          path: coverage.xml

  # The status check the main-protection ruleset requires is named `ci`,
  # and a matrix job reports one context per interpreter, none of them
  # spelled that. This is the one that is: it stands for the whole
  # matrix, so supporting another version never means editing the
  # ruleset.
  ci:
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every interpreter passed
        run: test "${{ needs.tests.result }}" = "success"
